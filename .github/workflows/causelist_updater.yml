name: Daily Causelist Updater

on:
  schedule:
    # Runs at 13:30 UTC (7:00 PM IST) every day
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  update-causelist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --quiet requests beautifulsoup4 PyMuPDF urllib3

      - name: Run Causelist Scraper
        run: |
          python -u .github/scripts/update_causelist.py
