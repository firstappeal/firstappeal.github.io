name: Daily Causelist Updater

on:
  schedule:
    # Runs at 4:00 AM UTC (9:30 AM IST) every weekday Mon-Fri
    - cron: '0 4 * * 1-5'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  update-causelist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --quiet requests beautifulsoup4 PyMuPDF urllib3

      - name: Run Causelist Scraper
        run: |
          python .github/scripts/update_causelist.py
