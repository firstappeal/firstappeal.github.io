name: Daily Causelist Updater

on:
  schedule:
    # Runs at 2:00 AM UTC (7:30 AM IST) every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  update-causelist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytesseract PyMuPDF Pillow

      - name: Run Causelist Scraper
        run: |
          python .github/scripts/update_causelist.py
