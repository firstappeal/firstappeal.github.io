<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bihar School Locator</title>
    <!-- Use Inter font for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header glassmorphism">
            <h1>Bihar School Locator</h1>
            <p>Find schools and check distance to railway stations</p>
        </header>

        <!-- Filters Section -->
        <section class="filters-container glassmorphism">
            <div class="filter-group">
                <label for="district-select">District</label>
                <select id="district-select">
                    <option value="">All Districts</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="block-select">Block</label>
                <select id="block-select" disabled>
                    <option value="">Select a District First</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="search-input">Search School / Cluster</label>
                <input type="text" id="search-input" placeholder="Type name...">
            </div>

            <div class="filter-group sort-toggle">
                <label>Sort by Distance</label>
                <button id="sort-btn" data-sort="asc">Closest First ⬇️</button>
            </div>
        </section>

        <!-- Results Info -->
        <div class="results-info">
            <span id="results-count">Loading schools...</span>
        </div>

        <!-- School List -->
        <main id="school-list" class="school-list">
            <!-- Cards will be injected here via JS -->
        </main>
        
        <!-- Loading State -->
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <p>Loading Data...</p>
        </div>
    </div>

    <!-- Load data first, then logic -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
